# Detection experiment. Class-agnostic wildlife localizer.
# Set DETECTION_DATA_CFG to a YOLO data yaml. It is not opened until training.

task: detection
name: yolo12s-d0
project: wildai-localization
seed: 41

tracking:
  mlflow:
    tracking_uri: http://127.0.0.1:5000
    experiment_name: wildai-localization
    run_name: yolo12s-d0
  dvc:
    enabled: false

data:
  format: yolo
  data_cfg: ${oc.env:DETECTION_DATA_CFG,configs/detection/yolo_configs/data/demo.yaml}
  force_merge: true
  discard: ["rocks", "vegetation", "other", "termite mound"]

model:
  backend: ultralytics
  pretrained: true
  weights: yolo12s.pt
  custom:
    image_encoder_backbone: timm/vit_base_patch14_dinov2.lvd142m
    image_encoder_backbone_source: timm
    count_regressor_layers: 13
    area_regressor_layers: 10
    roi_classifier_layers:
      p3: 13
      p4: 10
    fp_tp_loss_weight: 0.5
    count_loss_weight: 0.5
    area_loss_weight: 0.25
    box_size: 224

train:
  epochs: 25
  batch_size: 32
  imgsz: 800
  single_cls: true
  optimizer: AdamW
  lr0: 0.0001
  lrf: 0.1
  momentum: 0.99
  weight_decay: 0.0005
  warmup_epochs: 0
  cos_lr: true
  patience: 10
  iou: 0.4
  box: 3.5
  cls: 1.0
  dfl: 1.5
  device: cuda
  workers: 0
  degrees: 45.0
  mixup: 0.0
  cutmix: 0.5
  shear: 10.0
  copy_paste: 0.0
  erasing: 0.0
  scale: 0.2
  fliplr: 0.5
  flipud: 0.5
  hsv_h: 0.0
  hsv_s: 0.1
  hsv_v: 0.1
  translate: 0.2
  mosaic: 0.0
  multi_scale: false
  perspective: 0.0
  deterministic: false
  freeze: 9
  cache: false

curriculum:
  enable: false
  ratios: [0.0, 1.0, 2.5, 5.0]
  epochs: [10, 10, 5, 5]
  freeze: [9, 9, 9, 9]
  lr0s: [0.0001, 0.0001, 0.00005, 0.00005]

pretraining:
  epochs: 10
  lr0: 0.0001
  lrf: 0.1
  freeze: 0

# wildtrain evaluate still reads yolo_eval.yaml. This block is recorded only.
# A sweep objective must use an Ultralytics key such as metrics/mAP50(B).
eval:
  enabled: false
  split: val
  metrics: [metrics/precision(B), metrics/recall(B), metrics/mAP50(B), metrics/mAP50-95(B)]
  conf: 0.1
  iou: 0.6
