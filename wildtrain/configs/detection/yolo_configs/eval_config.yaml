# Same layout as yolo_eval.yaml. The raw Ultralytics model/data/epochs file is gone.

task: detection
name: detection-eval
weights: ${oc.env:LOCALIZER_WEIGHTS,models/best.pt}

data:
  format: yolo
  root: ${oc.env:DATA_ROOT,.}
  data_cfg: ${oc.env:DETECTION_DATA_CFG,configs/detection/yolo_configs/data/demo.yaml}

eval:
  split: val
  device: cpu
  batch_size: 8
  imgsz: 800
  iou: 0.7
  conf: 0.25
  single_cls: true
  results_dir: results/eval
