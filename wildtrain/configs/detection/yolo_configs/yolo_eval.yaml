# Standalone detection evaluation.
# Set DETECTION_DATA_CFG and LOCALIZER_WEIGHTS.

task: detection
name: detection-eval
weights: ${oc.env:LOCALIZER_WEIGHTS,models/best.pt}

data:
  format: yolo
  root: ${oc.env:DATA_ROOT,.}
  data_cfg: ${oc.env:DETECTION_DATA_CFG,configs/detection/yolo_configs/data/demo.yaml}
  force_merge: true
  discard: ["rocks", "vegetation", "other", "termite mound", "label", "detection", "background"]

eval:
  split: val
  device: cpu
  batch_size: 8
  imgsz: 800
  iou: 0.5
  conf: 0.25
  single_cls: true
  class_agnostic: false
  results_dir: results/eval
  metrics: [mAP, precision, recall, f1]
