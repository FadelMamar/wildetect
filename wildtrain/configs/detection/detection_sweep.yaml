# Detection sweep. Objective must be an Ultralytics metrics key, not map_50.
# Common keys: metrics/precision(B), metrics/recall(B), metrics/mAP50(B),
# metrics/mAP50-95(B), fitness.

task: detection
name: detection_sweep
project: wildai-localization
seed: 42

tracking:
  mlflow:
    tracking_uri: http://127.0.0.1:5000
    experiment_name: detection_sweep
    run_name: detection_sweep
  dvc:
    enabled: false

data:
  format: yolo
  data_cfg: ${oc.env:DETECTION_DATA_CFG,configs/detection/yolo_configs/data/demo.yaml}
  force_merge: true
  discard: ["rocks", "vegetation", "other", "termite mound"]

model:
  backend: ultralytics
  pretrained: true
  weights: yolo12s.pt

train:
  epochs: 25
  batch_size: 32
  imgsz: 800
  single_cls: true
  optimizer: AdamW
  lr0: 0.0001
  lrf: 0.1
  momentum: 0.99
  weight_decay: 0.0005
  warmup_epochs: 0
  patience: 10
  iou: 0.4
  device: cuda
  workers: 0
  freeze: 9

sweep:
  n_trials: 20
  direction: maximize
  objective: metrics/mAP50(B)
  seed: 42
  name: detection_sweep
  parameters:
    train.lr0: [0.0001, 0.001, 0.01]
    train.lrf: [0.01, 0.1, 0.5]
    train.batch_size: [8, 16, 32]
    train.epochs: [10, 20, 30]
    train.imgsz: [640, 1280]
    train.optimizer: [SGD, AdamW, Adam]
    train.weight_decay: [0.0001, 0.0005, 0.001]
