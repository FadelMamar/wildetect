# Standalone classification evaluation.
# Set DATA_ROOT and CLASSIFIER_WEIGHTS. Paths are checked when evaluation starts.

task: classification
name: classification-eval
weights: ${oc.env:CLASSIFIER_WEIGHTS,checkpoints/classification/best.ckpt}

data:
  format: roi
  root: ${oc.env:DATA_ROOT,.}
  input_size: 384
  batch_size: 8
  label_policy:
    mode: collapse
    positive_name: wildlife
    background_name: background
    discard: ["vegetation", "termite mound", "rocks", "other", "label", "detection"]

eval:
  split: val
  device: cpu
  batch_size: 8
  metrics: [accuracy, precision, recall, f1]
