# Classification experiment. ROI crops, collapsed to wildlife vs background.
# Set DATA_ROOT to the dataset root. The default "." only lets the file parse.

task: classification
name: base_dinov2
seed: 41

tracking:
  mlflow:
    experiment_name: wildtrain_classification
    run_name: base_dinov2
    log_model: true
  dvc:
    enabled: false

data:
  format: roi
  root: ${oc.env:DATA_ROOT,.}
  batch_size: 64
  num_workers: 4
  input_size: 384
  rebalance: true
  label_policy:
    mode: collapse
    positive_name: wildlife
    background_name: background
    discard: ["rocks", "vegetation", "other", "termite mound"]
  stats:
    mean: [0.554, 0.469, 0.348]
    std: [0.203, 0.173, 0.144]
  transforms:
    train:
      - name: Resize
        params:
          size: ${data.input_size}
      - name: RandomHorizontalFlip
        params:
          p: 0.5
      - name: ColorJitter
        params:
          brightness: 0.1
          contrast: 0.0
          saturation: 0.0
      - name: RandomRotation
        params:
          degrees: 45
    val:
      - name: Resize
        params:
          size: ${data.input_size}
  curriculum:
    enabled: false
    type: difficulty
    difficulty_strategy: linear
    start_difficulty: 0.0
    end_difficulty: 1.0
    warmup_epochs: 0
    log_frequency: 1
  crop_size: ${data.input_size}
  max_tn_crops: 1
  p_draw_annotations: 0.2
  compute_difficulties: true
  preserve_aspect_ratio: true

model:
  backend: timm
  backbone: timm/vit_base_patch14_reg4_dinov2.lvd142m
  pretrained: true
  dropout: 0.2
  freeze_backbone: true
  hidden_dim: 128
  num_layers: 2
  weights: checkpoints/classification/base_dinov2/best-v3.ckpt

train:
  epochs: 20
  lr: 1.0e-3
  lrf: 1.0e-2
  label_smoothing: 0.0
  weight_decay: 1.0e-3
  batch_size: ${data.batch_size}
  precision: bf16-mixed
  accelerator: auto
  num_workers: 4
  val_check_interval: 2

checkpoint:
  monitor: val_f1score
  mode: max
  patience: 10
  dirpath: checkpoints/classification
  save_top_k: 1
  save_last: true
  save_weights_only: true
  filename: best
  min_delta: 0.001

# wildtrain evaluate still reads classification_eval.yaml. This block is recorded only.
eval:
  enabled: false
  split: val
  metrics: [accuracy, precision, recall, f1, auroc]
